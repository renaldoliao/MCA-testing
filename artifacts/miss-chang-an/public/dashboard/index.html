<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Miss Chang An Back Office</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23b3221a'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' fill='%23f7efe2' font-family='serif'%3E%E5%BF%B5%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Noto+Serif+SC:wght@500;600&display=swap">
<style>
/* Same paper, ink and red as the Miss Chang An website. Tabs use a shared animated indicator and clear demo data. */
:root {
  color-scheme: light;
  --bg: #fff3d9;
  --ink: #2e1712;
  --muted: #6a4d42;
  --faint: #a08575;
  --line: #dcc79c;
  --soft: #f7e6c0;
  --red: #ad3b27;
  --red-soft: #f6d6c4;
  --font-display: "Libre Baskerville", Georgia, serif;
  --font-body: "Inter", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "Inter", "Helvetica Neue", Arial, sans-serif;
  --font-brush: "Noto Serif SC", "Songti SC", serif;
  --font-zh: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --spring: cubic-bezier(.34, 1.45, .64, 1);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
html[lang="zh"] body { font-family: var(--font-body), var(--font-zh); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); transition: box-shadow .35s var(--ease); }
.top.scrolled { box-shadow: 0 10px 30px -18px rgba(0,0,0,.28); }
.top-row { display: flex; align-items: center; gap: 14px; padding-block: 14px 10px; }
.seal { transition: transform .5s var(--spring); }
.seal:hover { transform: rotate(-6deg) scale(1.04); }
.seal { width: 42px; height: 42px; border-radius: 8px; background: var(--ink); color: var(--bg); flex: none; display: grid; place-items: center; font-family: var(--font-brush); font-size: 30px; line-height: 1; }
.brand { margin-right: auto; min-width: 0; }
.brand-name { font-family: var(--font-display); font-weight: 900; font-size: 20px; line-height: 1.1; letter-spacing: -0.01em; }
.brand-name .bz { font-family: var(--font-brush); font-weight: 400; color: var(--red); font-size: 22px; margin-left: 6px; }
.brand-sub { font-size: 14px; color: var(--muted); }
.sample-badge { display: inline-flex; margin-top: 3px; color: var(--red); font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }

.seg { display: inline-flex; background: var(--soft); border-radius: 22px; padding: 3px; flex: none; position: relative; isolation: isolate; }
.seg-thumb { position: absolute; top: 3px; bottom: 3px; left: 0; border-radius: 19px; background: var(--ink); z-index: -1; transition: transform .34s cubic-bezier(.22,.9,.25,1), width .34s cubic-bezier(.22,.9,.25,1); box-shadow: 0 4px 12px -4px rgba(0,0,0,.35); }
.seg button { border: 0; background: none; border-radius: 19px; padding: 6px 12px; font-size: 14px; font-weight: 700; cursor: pointer; color: var(--muted); white-space: nowrap; transition: color .3s var(--ease), transform .2s var(--spring); }
.seg button[aria-pressed="true"] { color: var(--bg); }
.seg button:active { transform: scale(.965); }

.tabs { display: flex; gap: 28px; overflow-x: auto; scrollbar-width: none; position: relative; }
.tab { border: 0; background: none; cursor: pointer; font-weight: 700; font-size: 17px; padding: 8px 0 12px; color: var(--muted); white-space: nowrap; position: relative; transition: color .3s var(--ease), transform .2s var(--spring); }
.tab:hover, .tab[aria-selected="true"] { color: var(--ink); }
.tab:active { transform: translateY(1px) scale(.97); }
.tab-ink { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--ink); border-radius: 3px 3px 0 0; transition: transform .36s cubic-bezier(.22,.9,.25,1), width .36s cubic-bezier(.22,.9,.25,1); pointer-events: none; }
.tab .dot-new { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--red); margin-left: 6px; vertical-align: 3px; }

main { padding-block: 28px 72px; }
[role="tabpanel"] { display: grid; gap: 32px; grid-template-columns: minmax(0, 1fr); }
[role="tabpanel"] > * { min-width: 0; }
.note { margin: 0; font-size: 14px; color: var(--muted); }
main { transition: opacity .18s var(--ease); }
body.swapping main, body.swapping .tabs { opacity: .72; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes inR { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }
@keyframes inL { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes grow { from { transform: scaleY(0); } to { transform: none; } }
@keyframes growX { from { transform: scaleX(0); } to { transform: none; } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(179,34,26,.45); } 70% { box-shadow: 0 0 0 7px rgba(179,34,26,0); } 100% { box-shadow: 0 0 0 0 rgba(179,34,26,0); } }
[role="tabpanel"].enter > * { animation: rise .38s var(--ease) both; animation-delay: calc(var(--i, 0) * 34ms); }
[role="tabpanel"].enter.from-r > * { animation-name: inR; }
[role="tabpanel"].enter.from-l > * { animation-name: inL; }

/* The numbers */
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
.kpi { display: grid; gap: 2px; min-width: 0; }
.k-label { font-size: 15px; color: var(--muted); }
.k-value { font-family: var(--font-display); font-weight: 900; font-size: clamp(40px, 8vw, 64px); line-height: 1; letter-spacing: -0.035em; font-variant-numeric: tabular-nums; }
.k-value.red { color: var(--red); }
.k-note { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.k-note b { color: var(--ink); font-weight: 700; }

/* Orders list */
.list-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 10px; border-bottom: 2px solid var(--ink); }
.list-head h2 { margin: 0; font-family: var(--font-display); font-weight: 900; font-size: 22px; }
.orders { list-style: none; margin: 0; padding: 0; }
.demo-order-board { padding: 20px; border: 1px solid var(--line); border-radius: 18px; background: #fffaf0; box-shadow: 0 12px 28px -24px rgba(46,23,18,.5); }
.demo-order-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 12px; }
.demo-order-head h2 { margin: 0; font: 700 20px/1.25 var(--font-display); }
.demo-order-label { color: var(--red); font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.demo-order-empty { margin: 0; color: var(--muted); }
.demo-order-list { display: grid; gap: 10px; }
.demo-order-card { display: grid; grid-template-columns: minmax(120px, .7fr) minmax(220px, 1.8fr) auto; gap: 10px 18px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: white; animation: rise .35s var(--ease) both; }
.demo-order-customer { font-weight: 800; }
.demo-order-meta, .demo-order-items, .demo-order-notes { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.demo-order-total { font-weight: 800; white-space: nowrap; text-align: right; }
.order.website-demo { background: #fffaf0; border-left: 3px solid var(--red); padding-left: 14px; }
.website-order-tag { display: inline-block; margin-left: 8px; font-size: 10px; color: var(--red); font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
.o-customer-note { display: block; margin-top: 5px; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
@media (max-width: 640px) { .demo-order-card { grid-template-columns: 1fr auto; } .demo-order-items, .demo-order-notes { grid-column: 1/-1; } }
.order { display: grid; grid-template-columns: 5.2em minmax(0, 1fr) auto auto; gap: 4px 18px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.order.fresh { animation: arrive .7s ease-out; }
@keyframes arrive { 0% { background: var(--red-soft); } 100% { background: transparent; } }
.o-time { font-family: var(--font-mono); font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; }
.o-who { min-width: 0; }
.o-name { font-weight: 700; }
.o-type { font-size: 14px; color: var(--muted); margin-left: 8px; }
.o-items { display: block; font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.o-total { font-family: var(--font-mono); font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.status { font-size: 14px; font-weight: 700; padding: 4px 12px; border-radius: 14px; white-space: nowrap; min-width: 7.4em; text-align: center; }
.status.done { background: var(--soft); color: var(--muted); }
.status.wait { background: var(--red); color: var(--bg); }
.status.later { background: var(--red-soft); color: var(--red); }
/* Week strip */
.strip-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.hint { font-size: 14px; color: var(--muted); }
.strip { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x proximity; padding: 4px 2px 14px; scrollbar-width: thin; }
.col { flex: 0 0 236px; scroll-snap-align: start; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); text-align: left; padding: 14px; cursor: pointer; display: flex; flex-direction: column; gap: 12px; min-height: 360px; transition: border-color .3s var(--ease), box-shadow .4s var(--ease), transform .3s var(--spring); }
.col[data-k]:hover { border-color: var(--ink); box-shadow: 0 18px 40px -26px rgba(0,0,0,.35); transform: translateY(-3px); }
.col[data-k]:active { transform: translateY(-1px) scale(.985); }
.col.today { border: 2px solid var(--ink); }
.col.closed { flex-basis: 128px; cursor: default; background: repeating-linear-gradient(135deg, var(--bg) 0 8px, var(--soft) 8px 9px); }
.col.closed:hover { border-color: var(--line); }
.c-head { display: grid; gap: 2px; }
.c-day { display: flex; align-items: baseline; gap: 6px; }
.c-day small { font-size: 14px; color: var(--muted); }
.c-day .num { font-family: var(--font-display); font-weight: 900; font-size: 26px; line-height: 1; }
.c-day .flag { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--red); display: inline-flex; align-items: center; gap: 6px; }
.c-day .flag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--red); animation: pulse 2s infinite; }
.c-sum { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.c-sum b { color: var(--ink); font-family: var(--font-display); font-weight: 900; font-size: 18px; }
.cards { display: flex; flex-direction: column; gap: 8px; }
.card { background: var(--soft); border-radius: 10px; padding: 9px 11px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 8px; font-size: 14px; }
.card .c-time { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.card .c-st { font-size: 12px; font-weight: 700; color: var(--muted); text-align: right; white-space: nowrap; }
.card .c-name { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .c-total { font-family: var(--font-mono); font-weight: 600; text-align: right; }
.card .c-type { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
.card.wait { background: var(--bg); box-shadow: inset 0 0 0 2px var(--red); }
.card.wait .c-st { color: var(--red); display: inline-flex; align-items: center; gap: 5px; justify-content: flex-end; }
.card.wait .c-st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--red); animation: pulse 1.8s infinite; }
.card { transition: transform .3s var(--spring), background-color .3s; }
.col[data-k]:hover .card { transform: translateX(2px); }
.card.later { background: var(--red-soft); }
.card.later .c-st { color: var(--red); }
.card.fresh { animation: arrive 2.4s ease-out; }
.c-empty { color: var(--faint); font-size: 14px; }
.c-open { margin-top: auto; font-size: 14px; font-weight: 700; color: var(--muted); transition: color .3s var(--ease), letter-spacing .4s var(--ease); }
.col[data-k]:hover .c-open { color: var(--ink); letter-spacing: .02em; }
.strip.enter .col { animation: rise .4s var(--ease) both; animation-delay: calc(var(--i) * 30ms); }
.strip.enter .card { animation: rise .32s var(--ease) both; animation-delay: calc(var(--i) * 30ms + var(--j) * 16ms + 55ms); }
.strip.from-r .col { animation: inR .34s var(--ease) both; animation-delay: calc(var(--i) * 26ms); }
.strip.from-l .col { animation: inL .34s var(--ease) both; animation-delay: calc((6 - var(--i)) * 26ms); }
.strip.fade { animation: fadeIn .26s var(--ease) both; }
.strip { -webkit-mask-image: linear-gradient(to right, transparent 0, #000 var(--fl, 0px), #000 calc(100% - var(--fr, 0px)), transparent 100%); mask-image: linear-gradient(to right, transparent 0, #000 var(--fl, 0px), #000 calc(100% - var(--fr, 0px)), transparent 100%); }
.ghost { position: fixed; z-index: 30; background: var(--bg); border: 2px solid var(--ink); border-radius: 0; overflow: hidden; pointer-events: none; box-shadow: 0 30px 60px -30px rgba(0,0,0,.4); }
.ghost > * { width: var(--gw); }

/* Zoomed day */
.zoom { display: grid; gap: 28px; }
.zoom.enter > * { animation: rise .36s var(--ease) both; animation-delay: calc(70ms + var(--i, 0) * 36ms); }
.zoom.enter .order { animation: rise .32s var(--ease) both; animation-delay: calc(120ms + var(--j, 0) * 24ms); }
.zoom.from-r .order, .zoom.from-r .kpis { animation: inR .34s var(--ease) both; animation-delay: calc(var(--j, 0) * 24ms); }
.zoom.from-l .order, .zoom.from-l .kpis { animation: inL .34s var(--ease) both; animation-delay: calc(var(--j, 0) * 24ms); }
.zoom-head h2 { transition: opacity .3s; }
.zoom-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.zoom-head h2 { margin: 0 auto 0 0; font-family: var(--font-display); font-weight: 900; font-size: 28px; letter-spacing: -0.01em; }
.back { border: 0; background: var(--soft); border-radius: 20px; padding: 8px 16px; font-weight: 700; font-size: 15px; cursor: pointer; transition: background-color .25s var(--ease), color .25s, transform .25s var(--spring); }
.back:hover { background: var(--ink); color: var(--bg); }
.back:active { transform: scale(.92); }
.zoom .o-items { white-space: normal; }
.zoom .orders { border-top: 2px solid var(--ink); }
.more { background: none; border: 0; padding: 14px 0 0; cursor: pointer; font-size: 16px; font-weight: 700; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--faint); }
.more:hover { text-decoration-color: var(--red); }

/* Sales */
.weeknav { display: flex; align-items: center; gap: 8px; }
.arrow { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--soft); cursor: pointer; font-size: 18px; font-weight: 700; display: grid; place-items: center; transition: background-color .25s var(--ease), transform .25s var(--spring), opacity .3s; }
.arrow:hover:not(:disabled) { background: var(--ink); color: var(--bg); }
.arrow:active:not(:disabled) { transform: scale(.86); }
.arrow:disabled { opacity: .3; cursor: default; }
.wk-label { font-weight: 700; font-size: 18px; min-width: 8.5em; text-align: center; }

.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.day { border: 0; border-right: 1px solid var(--line); background: var(--bg); text-align: left; padding: 12px 12px 12px; cursor: pointer; display: grid; grid-template-rows: auto auto auto 1fr; gap: 2px; min-height: 180px; min-width: 0; transition: background-color .4s var(--ease), color .4s var(--ease); }
.day:active:not(:disabled) .d-sales { transform: scale(.95); }
.d-sales { transition: transform .25s var(--spring); display: inline-block; }
.week.enter .bar { animation: grow .54s var(--ease) both; animation-delay: calc(var(--i) * 28ms + 60ms); }
.swap > * { animation: rise .32s var(--ease) both; animation-delay: calc(var(--j, 0) * 26ms); }
.day:last-child { border-right: 0; }
.day:hover:not(:disabled) { background: var(--soft); }
.day:disabled { cursor: default; }
.day[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.day[aria-pressed="true"] .d-meta, .day[aria-pressed="true"] .d-date small { color: rgba(247,239,226,.7); }
.day[aria-pressed="true"] .bar { background: var(--bg); }
.day[aria-pressed="true"] .d-flag { color: #f2a28f; }
.d-date { display: flex; align-items: baseline; gap: 6px; }
.d-date small { font-size: 13px; color: var(--muted); }
.d-date .num { font-family: var(--font-display); font-weight: 900; font-size: 22px; line-height: 1; }
.d-flag { font-size: 12px; font-weight: 700; color: var(--red); min-height: 18px; }
.d-sales { font-family: var(--font-display); font-weight: 900; font-size: 19px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.d-meta { font-size: 13px; color: var(--muted); }
.d-off { color: var(--faint); font-size: 14px; align-self: center; }
.bar-area { display: flex; align-items: flex-end; height: 56px; margin-top: 8px; }
.bar { width: 100%; background: var(--ink); border-radius: 4px 4px 0 0; transform-origin: bottom; transition: height .5s var(--ease), background-color .4s var(--ease); }
.day.topday .bar { background: var(--red); }
.day.closed { background: repeating-linear-gradient(135deg, var(--bg) 0 8px, var(--soft) 8px 9px); }

.daybox { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 36px; align-items: start; }
.sub-title { margin: 0 0 12px; font-family: var(--font-display); font-weight: 900; font-size: 20px; }
.daynums { display: grid; gap: 14px; }
.best { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; counter-reset: rank; }
.best li { display: grid; grid-template-columns: 1.6em minmax(0, 1fr) auto; gap: 4px 10px; align-items: baseline; counter-increment: rank; }
.best li::before { content: counter(rank); font-family: var(--font-mono); font-weight: 600; color: var(--muted); font-size: 14px; }
.best li:first-child::before { color: var(--red); }
.best .nm { font-weight: 700; min-width: 0; }
.best .nm small { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 6px; }
.best .v { font-family: var(--font-mono); font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }

/* Website */
.checklist { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
.checklist li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px; padding: 14px 0; border-bottom: 1px solid var(--line); align-items: center; }
.checklist .what { font-weight: 700; }
.checklist .why { grid-column: 1; color: var(--muted); font-size: 15px; }
.chip { grid-column: 2; grid-row: 1 / span 2; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 11px; white-space: nowrap; }
.chip.live { background: var(--soft); color: var(--ink); }
.chip.soon { background: var(--red-soft); color: var(--red); }
.site-link { font-weight: 700; color: var(--red); text-underline-offset: 3px; text-decoration-thickness: 1px; transition: text-underline-offset .3s var(--ease), text-decoration-thickness .3s; }
.site-link:hover { text-underline-offset: 6px; text-decoration-thickness: 2px; }
.checklist li { transition: padding .35s var(--ease), background-color .35s; }
.checklist li:hover { padding-left: 8px; }

.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--bg); border-radius: 16px; padding: 12px 16px 12px 14px; display: flex; align-items: center; gap: 12px; max-width: calc(100% - 32px); box-shadow: 0 20px 50px -20px rgba(0,0,0,.5); transform: translate(-50%, 110%); opacity: 0; transition: transform .34s cubic-bezier(.22,.9,.25,1), opacity .22s ease; font-size: 15px; }
.toast.show { transform: translate(-50%, 0); opacity: 1; }
.toast .t-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); flex: none; animation: pulse 1.6s infinite; }
.toast b { font-family: var(--font-mono); }

footer.site { border-top: 1px solid var(--line); padding-block: 18px 30px; color: var(--muted); font-size: 14px; display: flex; gap: 18px; flex-wrap: wrap; }

@media (max-width: 760px) {
  .daybox { grid-template-columns: 1fr; }
  .week { grid-template-columns: 1fr; }

/* One interaction rhythm for sections, controls, and content. */
@keyframes panel-swap {

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { moveInk(); moveThumb(document.getElementById("langSeg")); });

  // Refresh statuses and saved website orders; never inject fake incoming orders.
  setInterval(() => {
    document.getElementById("today").textContent = t().daysLong[day.getDay()] + ", " + t().date(day) + " · " + clock(now());
    if (!busy && !document.getElementById("orders").hidden) renderOrders();
  }, 10000);

  const requestedCustomerOrder = readCustomerOrders().find(order => order.id === new URLSearchParams(location.search).get("order")) || readCustomerOrders()[0];
  if (requestedCustomerOrder) {
    const target = BY_KEY[key(requestedCustomerOrder.date)] || DAYS[DAYS.length - 1];
    const weekStart = date => { const value = new Date(date); value.setDate(value.getDate() - (value.getDay() + 6) % 7); value.setHours(12, 0, 0, 0); return value; };
    owk = Math.max(0, Math.min(maxBack, Math.round((weekStart(day) - weekStart(target.dt)) / 604800000)));
    zoomKey = key(target.dt);
  }
  window.mcaRenderSamples = () => { renderOrders(); };
  window.mcaToast = html => toast(html);
  window.mcaLang = () => lang;
  renderTop(); renderSite(); renderMenu();
  const h = (location.hash || "").slice(1);
  show(["orders", "sales", "menu", "reservations", "chat", "site"].includes(h) ? h : "orders");
  if (requestedCustomerOrder && new URLSearchParams(location.search).has("order")) requestAnimationFrame(() => {
    [...document.querySelectorAll("[data-customer-order]")].find(row => row.dataset.customerOrder === requestedCustomerOrder.id)?.scrollIntoView({ block: "center" });
  });
})();
</script>
